<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Círculo Rápido</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green-deep:   #0d1f0f;
    --green-dark:   #122614;
    --green-mid:    #1a3a1c;
    --green-accent: #2d6b30;
    --red-vivid:    #e8212a;
    --red-glow:     #ff3340;
    --red-dark:     #8b0009;
    --gold:         #f5c842;
    --white:        #f0ede8;
    --timer-warn:   #ff6b35;
    --timer-crit:   #ff1a1a;
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--green-deep);
    font-family: 'Space Mono', monospace;
    cursor: crosshair;
    user-select: none;
  }

  /* ── NOISE TEXTURE OVERLAY ── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
    opacity: 0.04;
    pointer-events: none;
    z-index: 1000;
  }

  /* ── GRID LINES ── */
  body::after {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(45,107,48,0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(45,107,48,0.08) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
    z-index: 999;
  }

  /* ══════════════════════════════
     SCREEN MANAGEMENT
  ══════════════════════════════ */
  .screen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    transition: opacity 0.4s ease, transform 0.4s ease;
    z-index: 10;
  }
  .screen.hidden {
    opacity: 0; pointer-events: none;
    transform: scale(0.97);
  }

  /* ══════════════════════════════
     MENU SCREEN
  ══════════════════════════════ */
  #menu {
    gap: 0;
  }

  .menu-eyebrow {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.35em;
    color: var(--green-accent);
    text-transform: uppercase;
    margin-bottom: 18px;
    opacity: 0.8;
  }

  .menu-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(5rem, 14vw, 10rem);
    line-height: 0.88;
    color: var(--white);
    text-align: center;
    letter-spacing: 0.02em;
    text-shadow:
      0 0 60px rgba(232,33,42,0.4),
      0 0 120px rgba(232,33,42,0.15);
    animation: titlePulse 3s ease-in-out infinite;
  }

  .menu-title span {
    color: var(--red-vivid);
    text-shadow:
      0 0 30px rgba(232,33,42,0.8),
      0 0 80px rgba(232,33,42,0.4);
  }

  @keyframes titlePulse {
    0%,100% { text-shadow: 0 0 60px rgba(232,33,42,0.4), 0 0 120px rgba(232,33,42,0.15); }
    50%      { text-shadow: 0 0 80px rgba(232,33,42,0.6), 0 0 160px rgba(232,33,42,0.25); }
  }

  .menu-sub {
    font-size: 0.75rem;
    color: var(--green-accent);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin: 20px 0 50px;
    opacity: 0.7;
  }

  .menu-deco {
    width: 180px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--red-vivid), transparent);
    margin: 16px auto;
    opacity: 0.6;
  }

  /* ── PLAY BUTTON ── */
  .btn-play {
    position: relative;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.8rem;
    letter-spacing: 0.15em;
    color: var(--green-deep);
    background: var(--red-vivid);
    border: none;
    padding: 18px 64px;
    cursor: pointer;
    clip-path: polygon(12px 0%, 100% 0%, calc(100% - 12px) 100%, 0% 100%);
    transition: background 0.15s, transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 0 30px rgba(232,33,42,0.5), 0 4px 20px rgba(0,0,0,0.5);
  }
  .btn-play:hover {
    background: var(--red-glow);
    transform: scale(1.05);
    box-shadow: 0 0 50px rgba(232,33,42,0.8), 0 4px 30px rgba(0,0,0,0.6);
  }
  .btn-play:active { transform: scale(0.98); }

  .btn-play::before {
    content: '▶';
    margin-right: 10px;
    font-size: 1.2rem;
    vertical-align: middle;
  }

  /* ══════════════════════════════
     GAME SCREEN
  ══════════════════════════════ */
  #game { pointer-events: none; }
  #game.active { pointer-events: all; }

  /* ── HUD ── */
  #hud {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 28px;
    z-index: 500;
    background: linear-gradient(180deg, rgba(13,31,15,0.95) 0%, transparent 100%);
    pointer-events: none;
  }

  .hud-block {
    display: flex; flex-direction: column;
    align-items: center; gap: 2px;
  }

  .hud-label {
    font-size: 0.55rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--green-accent);
    opacity: 0.7;
  }

  #timer-display {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.8rem;
    line-height: 1;
    color: var(--white);
    transition: color 0.3s;
    text-shadow: 0 0 20px rgba(240,237,232,0.3);
    min-width: 70px;
    text-align: center;
  }
  #timer-display.warn  { color: var(--timer-warn); text-shadow: 0 0 20px rgba(255,107,53,0.6); }
  #timer-display.crit  { color: var(--timer-crit); text-shadow: 0 0 30px rgba(255,26,26,0.8); animation: critBlink 0.5s ease-in-out infinite; }

  @keyframes critBlink {
    0%,100% { opacity: 1; } 50% { opacity: 0.6; }
  }

  #score-display {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.8rem;
    line-height: 1;
    color: var(--gold);
    text-shadow: 0 0 20px rgba(245,200,66,0.4);
    min-width: 70px;
    text-align: center;
  }

  /* ── CIRCLES ── */
  .circle {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, var(--red-glow), var(--red-vivid) 50%, var(--red-dark) 100%);
    box-shadow:
      0 0 20px rgba(232,33,42,0.7),
      0 0 50px rgba(232,33,42,0.3),
      inset 0 -4px 10px rgba(0,0,0,0.4),
      inset 0 4px 8px rgba(255,150,155,0.3);
    cursor: crosshair;
    pointer-events: all;
    transform: scale(0);
    animation: circleIn 0.18s cubic-bezier(0.34,1.56,0.64,1) forwards;
    will-change: transform, opacity;
  }

  @keyframes circleIn {
    to { transform: scale(1); }
  }

  .circle.dying {
    animation: circleDie 0.2s ease-in forwards;
  }

  @keyframes circleDie {
    0%   { transform: scale(1); opacity: 1; }
    60%  { transform: scale(1.3); opacity: 0.5; }
    100% { transform: scale(0); opacity: 0; }
  }

  .circle.fading {
    animation: circleFade 0.25s ease-out forwards;
  }

  @keyframes circleFade {
    0%   { transform: scale(1); opacity: 1; }
    100% { transform: scale(0.5); opacity: 0; }
  }

  /* ── SCORE POPUP ── */
  .score-popup {
    position: absolute;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.6rem;
    color: var(--gold);
    text-shadow: 0 0 10px rgba(245,200,66,0.8);
    pointer-events: none;
    z-index: 600;
    animation: popUp 0.7s ease-out forwards;
    white-space: nowrap;
  }

  @keyframes popUp {
    0%   { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-60px) scale(0.7); opacity: 0; }
  }

  /* ── RIPPLE ── */
  .ripple {
    position: absolute;
    border-radius: 50%;
    border: 2px solid var(--red-vivid);
    pointer-events: none;
    z-index: 400;
    animation: rippleOut 0.5s ease-out forwards;
  }
  @keyframes rippleOut {
    0%   { transform: scale(0.5); opacity: 0.8; }
    100% { transform: scale(2.5); opacity: 0; }
  }

  /* ══════════════════════════════
     GAME OVER SCREEN
  ══════════════════════════════ */
  #gameover { gap: 0; }

  .go-eyebrow {
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.4em;
    color: var(--red-vivid);
    text-transform: uppercase;
    margin-bottom: 12px;
    animation: fadeSlideIn 0.5s ease both;
  }

  .go-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(4rem, 12vw, 8rem);
    color: var(--white);
    line-height: 0.9;
    text-align: center;
    letter-spacing: 0.02em;
    animation: fadeSlideIn 0.5s 0.1s ease both;
  }

  .go-deco {
    width: 200px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 22px auto;
    animation: fadeSlideIn 0.5s 0.2s ease both;
  }

  .go-score-label {
    font-size: 0.65rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--green-accent);
    margin-bottom: 8px;
    animation: fadeSlideIn 0.5s 0.3s ease both;
  }

  .go-score {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(5rem, 15vw, 11rem);
    color: var(--gold);
    line-height: 1;
    text-shadow:
      0 0 40px rgba(245,200,66,0.5),
      0 0 100px rgba(245,200,66,0.2);
    animation: fadeSlideIn 0.5s 0.35s ease both, scoreGlow 2s 0.9s ease-in-out infinite;
  }

  @keyframes scoreGlow {
    0%,100% { text-shadow: 0 0 40px rgba(245,200,66,0.5), 0 0 100px rgba(245,200,66,0.2); }
    50%      { text-shadow: 0 0 60px rgba(245,200,66,0.8), 0 0 140px rgba(245,200,66,0.35); }
  }

  .go-pts {
    font-size: 0.7rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--green-accent);
    margin-top: -4px;
    margin-bottom: 40px;
    animation: fadeSlideIn 0.5s 0.4s ease both;
  }

  .btn-retry {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.6rem;
    letter-spacing: 0.15em;
    color: var(--green-deep);
    background: var(--gold);
    border: none;
    padding: 16px 56px;
    cursor: pointer;
    clip-path: polygon(12px 0%, 100% 0%, calc(100% - 12px) 100%, 0% 100%);
    transition: background 0.15s, transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 0 30px rgba(245,200,66,0.4), 0 4px 20px rgba(0,0,0,0.4);
    animation: fadeSlideIn 0.5s 0.5s ease both;
  }
  .btn-retry:hover {
    background: #ffd84a;
    transform: scale(1.05);
    box-shadow: 0 0 50px rgba(245,200,66,0.7), 0 4px 30px rgba(0,0,0,0.5);
  }
  .btn-retry:active { transform: scale(0.98); }
  .btn-retry::before { content: '↺  '; }

  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── TIME BONUS FLASH ── */
  .time-bonus {
    position: fixed;
    top: 60px; left: 50%;
    transform: translateX(-50%);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.2rem;
    color: #7fff7f;
    letter-spacing: 0.1em;
    pointer-events: none;
    z-index: 700;
    animation: bonusFlash 0.8s ease-out forwards;
  }
  @keyframes bonusFlash {
    0%   { opacity: 1; transform: translateX(-50%) translateY(0); }
    100% { opacity: 0; transform: translateX(-50%) translateY(-30px); }
  }
</style>
</head>
<body>

<!-- ══ MENU ══ -->
<div class="screen" id="menu">
  <p class="menu-eyebrow">Tiempo &amp; Reflejos</p>
  <h1 class="menu-title">CÍRCULO<br><span>RÁPIDO</span></h1>
  <div class="menu-deco"></div>
  <p class="menu-sub">Toca los círculos · Gana tiempo · Sobrevive</p>
  <button class="btn-play" id="btnPlay">JUGAR</button>
</div>

<!-- ══ GAME ══ -->
<div class="screen hidden" id="game">
  <div id="hud">
    <div class="hud-block">
      <span class="hud-label">Tiempo</span>
      <span id="timer-display">30</span>
    </div>
    <div class="hud-block">
      <span class="hud-label">Puntos</span>
      <span id="score-display">0</span>
    </div>
  </div>
  <!-- circles injected here -->
</div>

<!-- ══ GAME OVER ══ -->
<div class="screen hidden" id="gameover">
  <p class="go-eyebrow">Tiempo agotado</p>
  <h2 class="go-title">GAME<br>OVER</h2>
  <div class="go-deco"></div>
  <p class="go-score-label">Puntuación final</p>
  <p class="go-score" id="finalScore">0</p>
  <p class="go-pts">puntos</p>
  <button class="btn-retry" id="btnRetry">JUGAR DE NUEVO</button>
</div>

<script>
(() => {
  /* ── STATE ── */
  let score        = 0;
  let timeLeft     = 30;
  let gameRunning  = false;
  let tickInterval = null;
  let spawnTimeout = null;
  const activeCircles = new Set();

  /* ── ELEMENTS ── */
  const menuScreen    = document.getElementById('menu');
  const gameScreen    = document.getElementById('game');
  const gameoverScreen= document.getElementById('gameover');
  const timerDisplay  = document.getElementById('timer-display');
  const scoreDisplay  = document.getElementById('score-display');
  const finalScore    = document.getElementById('finalScore');
  const btnPlay       = document.getElementById('btnPlay');
  const btnRetry      = document.getElementById('btnRetry');

  /* ── SCREEN TRANSITIONS ── */
  function showScreen(screen) {
    [menuScreen, gameScreen, gameoverScreen].forEach(s => s.classList.add('hidden'));
    screen.classList.remove('hidden');
  }

  /* ── CIRCLE SIZING ── */
  function randomSize() {
    // Random between 44px and 90px
    return Math.floor(Math.random() * 47) + 44;
  }

  /* ── SPAWN CIRCLE ── */
  function spawnCircle() {
    if (!gameRunning) return;

    const size   = randomSize();
    const margin = size + 10;
    const x      = Math.random() * (window.innerWidth  - margin * 2) + margin;
    const y      = Math.random() * (window.innerHeight - margin * 2 - 70) + margin + 60;
    const lifetime = (Math.random() * 0.55 + 0.35 ) * 1000; // 1000–3000 ms

    const circle = document.createElement('div');
    circle.className = 'circle';
    circle.style.cssText = `
      width:${size}px; height:${size}px;
      left:${x - size / 2}px; top:${y - size / 2}px;
    `;

    activeCircles.add(circle);
    gameScreen.appendChild(circle);

    // Auto-remove when lifetime ends
    const deathTimer = setTimeout(() => removeCircle(circle, false), lifetime);
    circle._deathTimer = deathTimer;

    // Click handler
    circle.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      if (!gameRunning) return;
      clearTimeout(circle._deathTimer);
      hitCircle(circle, x, y);
    });

    // Schedule next spawn (staggered: 400–900ms)
    const nextSpawn = Math.random() * 500 + 400;
    spawnTimeout = setTimeout(spawnCircle, nextSpawn);
  }

  function removeCircle(circle, clicked) {
    if (!activeCircles.has(circle)) return;
    activeCircles.delete(circle);
    circle.classList.add(clicked ? 'dying' : 'fading');
    circle.style.pointerEvents = 'none';
    setTimeout(() => circle.remove(), 300);
  }

  /* ── HIT A CIRCLE ── */
  function hitCircle(circle, cx, cy) {
    removeCircle(circle, true);

    score++;
    scoreDisplay.textContent = score;

    // +3 seconds
    timeLeft = Math.min(timeLeft + 0.75, 99);
    updateTimerDisplay();
    showTimeBonus();

    // Ripple effect
    spawnRipple(cx, cy, parseInt(circle.style.width));

    // Score popup
    spawnScorePopup(cx, cy);
  }

  /* ── RIPPLE ── */
  function spawnRipple(x, y, size) {
    const r = document.createElement('div');
    r.className = 'ripple';
    r.style.cssText = `
      width:${size}px; height:${size}px;
      left:${x - size/2}px; top:${y - size/2}px;
    `;
    gameScreen.appendChild(r);
    setTimeout(() => r.remove(), 500);
  }

  /* ── SCORE POPUP ── */
  function spawnScorePopup(x, y) {
    const p = document.createElement('div');
    p.className = 'score-popup';
    p.textContent = '+1';
    p.style.left = (x - 15) + 'px';
    p.style.top  = (y - 20) + 'px';
    gameScreen.appendChild(p);
    setTimeout(() => p.remove(), 700);
  }

  /* ── TIME BONUS FLASH ── */
  function showTimeBonus() {
    const old = document.querySelector('.time-bonus');
    if (old) old.remove();
    const el = document.createElement('div');
    el.className = 'time-bonus';
    el.textContent = '+3s';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 800);
  }

  /* ── TIMER ── */
  function updateTimerDisplay() {
    timerDisplay.textContent = Math.ceil(timeLeft);
    timerDisplay.classList.remove('warn', 'crit');
    if (timeLeft <= 5)       timerDisplay.classList.add('crit');
    else if (timeLeft <= 10) timerDisplay.classList.add('warn');
  }

  function startTick() {
    const INTERVAL = 100; // ms
    tickInterval = setInterval(() => {
      timeLeft -= INTERVAL / 1000;
      if (timeLeft <= 0) {
        timeLeft = 0;
        updateTimerDisplay();
        endGame();
      } else {
        updateTimerDisplay();
      }
    }, INTERVAL);
  }

  /* ── START GAME ── */
  function startGame() {
    // Reset state
    score     = 0;
    timeLeft  = 30;
    gameRunning = true;

    scoreDisplay.textContent = '0';
    updateTimerDisplay();

    // Clear leftover circles
    activeCircles.forEach(c => { clearTimeout(c._deathTimer); c.remove(); });
    activeCircles.clear();

    showScreen(gameScreen);
    gameScreen.classList.add('active');

    startTick();
    spawnTimeout = setTimeout(spawnCircle, 300);
  }

  /* ── END GAME ── */
  function endGame() {
    gameRunning = false;
    clearInterval(tickInterval);
    clearTimeout(spawnTimeout);

    gameScreen.classList.remove('active');

    // Kill remaining circles instantly
    activeCircles.forEach(c => {
      clearTimeout(c._deathTimer);
      c.remove();
    });
    activeCircles.clear();

    finalScore.textContent = score;
    setTimeout(() => showScreen(gameoverScreen), 300);
  }

  /* ── EVENT LISTENERS ── */
  btnPlay.addEventListener('click', startGame);
  btnRetry.addEventListener('click', startGame);

})();
</script>
</body>
</html>
